/* ---- entries: one model for every kind of type ---- */
function ids(ty,src){const c=src.c;if(ty.pages)return PAGES.map(p=>p[0]);if(ty.fixed)return ty.fixed;if(ty.lists)return ty.lists.map(x=>x[0]).filter(k=>c[k]!==undefined);const s=c[ty.store];if(!s)return[];
 if(ty.key==='@')return Object.keys(s);if(ty.key==='#')return s.map((_,i)=>String(i));return s.map(e=>String(e[ty.key]))}
function idx(ty,src,id){const s=src.c[ty.store];if(ty.key==='#')return +id<s.length?+id:-1;return s.findIndex(e=>String(e[ty.key])===String(id))}
function ent(ty,src,id){const c=src.c;
 if(ty.pages){const o={};pageKeys(id).forEach(k=>{if(src.t[k]!==undefined)o[k]=src.t[k]});return o}
 if(ty.fixed){const o={};ty.parts.forEach(p=>{if(c[p])o[p]=JSON.parse(JSON.stringify(c[p][id]))});return o}
 if(ty.lists)return c[id]===undefined?undefined:JSON.parse(JSON.stringify(c[id]));
 if(ty.key==='@')return c[ty.store][id]===undefined?undefined:JSON.parse(JSON.stringify(c[ty.store][id]));
 const i=idx(ty,src,id);if(i<0)return undefined;const e=JSON.parse(JSON.stringify(c[ty.store][i]));
 (ty.joins||[]).forEach(j=>{const st=c[j[0]]||{};const v=j[3]==='byIndex'?st[i]:st[id];e[j[1]]=v===undefined?JSON.parse(JSON.stringify(j[2])):JSON.parse(JSON.stringify(v))});return e}
function put(ty,src,id,e,at){const c=src.c;
 if(ty.pages){Object.keys(e).forEach(k=>{src.t[k]=e[k]});return id}
 if(ty.fixed){ty.parts.forEach(p=>{if(e[p]!==undefined){c[p]=c[p]||{};c[p][id]=e[p]}});return id}
 if(ty.lists){c[id]=e;return id}
 if(ty.key==='@'){c[ty.store][id]=e;return id}
 const row=Array.isArray(e)?e.slice():Object.assign({},e),extra={};(ty.joins||[]).forEach(j=>{extra[j[1]]=row[j[1]];delete row[j[1]]});
 const s=c[ty.store];let i=idx(ty,src,id);if(i<0){i=at==null?s.length:Math.min(at,s.length);s.splice(i,0,row)}else s[i]=row;
 const nid=ty.key==='#'?String(i):String(row[ty.key]);
 (ty.joins||[]).forEach(j=>{c[j[0]]=c[j[0]]||{};const v=extra[j[1]];if(j[3]==='byIndex'){if(v!==undefined)c[j[0]][i]=v}else{if(nid!==id&&c[j[0]][id]!==undefined&&id!=='')delete c[j[0]][id];if(v!==undefined&&v!==null)c[j[0]][nid]=v}});
 return nid}
function drop(ty,src,id){const c=src.c,i=idx(ty,src,id);if(i<0)return;c[ty.store].splice(i,1);(ty.joins||[]).forEach(j=>{if(!c[j[0]])return;if(j[3]==='byIndex')c[j[0]].splice(i,1);else delete c[j[0]][id]})}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const estat=(ty,id)=>{const d=ent(ty,CM.draft,id),l=ent(ty,CM.live,id);if(d===undefined)return['Removed, not published','Cancelled','del'];if(l===undefined)return['New, not published','Pending','new'];return same(d,l)?['Published','Confirmed','ok']:['Changed, not published','Pending','chg']};
const orderChanged=ty=>!ty.pages&&!ty.fixed&&!ty.lists&&ty.key!=='#'&&ty.key!=='@'&&(()=>{const a=ids(ty,CM.draft),b=ids(ty,CM.live).filter(x=>a.includes(x));return !same(a.filter(x=>b.includes(x)),b)})();
const pending=()=>{const L=[];TYPES.forEach(ty=>{const all=[...new Set([...ids(ty,CM.draft),...ids(ty,CM.live)])];all.forEach(id=>{const s=estat(ty,id);if(s[2]!=='ok')L.push({ty,id,s})});if(orderChanged(ty))L.push({ty,id:null,s:['Order changed, not published','Pending','ord']})});return L};
const hkey=(ty,id)=>ty.id+'~'+id;
const addHist=(ty,id,kind,note)=>{const k=hkey(ty,id);(CM.hist[k]=CM.hist[k]||[{n:1,t:ago(26000),by:'hania',kind:'Imported from the website',note:'17 Nov copy update',snap:ent(ty,CM.live,id)}]);const H=CM.hist[k];H.push({n:H.length+1,t:tick(),by:me().id,kind,note:note||'',snap:ent(ty,CM.draft,id)})};
const histOf=(ty,id)=>CM.hist[hkey(ty,id)]||[{n:1,t:ago(26000),by:'hania',kind:'Imported from the website',note:'17 Nov copy update',snap:ent(ty,CM.live,id)}];
function publish(ty,id){if(id===null){/* order */const s=CM.live.c[ty.store],d=CM.draft.c[ty.store];const ord=d.map(e=>String(e[ty.key]));s.sort((a,b)=>ord.indexOf(String(a[ty.key]))-ord.indexOf(String(b[ty.key])));return}
 const d=ent(ty,CM.draft,id);if(d===undefined){drop(ty,CM.live,id);return}
 const at=ids(ty,CM.draft).indexOf(id);put(ty,CM.live,id,JSON.parse(JSON.stringify(d)),at);addHist(ty,id,'Published')}
const usedBy=(ty,id)=>{const c=CM.draft.c,u=[];if(ty.id==='dests')(c.TRIPS||[]).filter(t=>t.dest===id).forEach(t=>u.push(t.t));if(ty.id==='exps')(c.TRIPS||[]).filter(t=>(t.exps||[]).includes(id)).forEach(t=>u.push(t.t));
 if(ty.id==='trips'){(c.FAVS||[]).filter(f=>f.trip===id).forEach(f=>u.push('Fav: '+f.t));Object.entries(c.RESULTS||{}).filter(r=>r[1].trip===id).forEach(r=>u.push('Travel match result: '+r[0]))}return u};
const findHits=q=>{q=q.trim().toLowerCase();if(q.length<3)return[];const hits=[];
 Object.keys(CM.draft.t).forEach(k=>{const v=String(CM.draft.t[k]);if(v.toLowerCase().includes(q))hits.push({ty:TY('pages'),id:pageOfKey(k),txt:v,where:(PAGES.find(p=>p[0]===pageOfKey(k))||['','Page text'])[1],key:k})});
 TYPES.filter(t=>!t.pages).forEach(ty=>ids(ty,CM.draft).forEach(id=>{const e=ent(ty,CM.draft,id),s=JSON.stringify(e);if(s.toLowerCase().includes(q)){const m=[];(function w(x){if(typeof x==='string'&&x.toLowerCase().includes(q))m.push(x);else if(x&&typeof x==='object')Object.values(x).forEach(w)})(e);hits.push({ty,id,txt:m[0]||ty.title(e,id),where:ty.name+' · '+ty.title(e,id)})}}));return hits.slice(0,40)};

V.cms=sub=>{const [tid,eid]=(sub||'').replace(/^-/,'').split('~');const ty=TY(tid||'');const P=pending(),own=ccan('publish');
 const side=`<nav class="cmsnav" aria-label="Content types"><label class="cfind"><span class="vh">Find any text</span>${ic('search',16)}<input id="cfq" type="search" placeholder="Find any text on the website" value="${esc(S.cfq||'')}"></label>${TYPES.map(t=>{const n=ids(t,CM.draft).length,w=P.filter(p=>p.ty===t).length;return `<a class="${ty===t?'on':''}" href="#cms-${t.id}"><span>${esc(t.name)}</span><span class="muted small">${w?`<span class="dotw" aria-label="${w} waiting to publish"></span>`:''}${n}</span></a>`}).join('')}</nav>`;
 let main;
 if((S.cfq||'').trim().length>=3&&!ty)main=cmsFind();
 else if(!ty)main=cmsHome(P,own);
 else if(eid!==undefined)main=cmsEntry(ty,decodeURIComponent(eid));

 return `<div class="head"><div><h1>Content</h1><p class="muted sub">Everything on the website, in one place. Pick what you want to change: a trip, a destination, a page. Changes save as a draft while you type. An owner publishes.</p></div>${own?`<div class="hact"><button class="btn" data-cx="export">Export content file</button>${P.length?`<button class="btn solid" data-cx="pubAll">Publish all (${P.length})</button>`:''}</div>`:''}</div>

 if(e.target.closest('[data-replay]')){const l=S.lastEv;if(l)fire(l.type,l.ref,l.text,l.evId);return}
 const rel=e.target.closest('[data-release]');if(rel){const t=tripOf(rel.dataset.release),h=t.hold.shift();if(h){const b=BK.find(x=>x.ref===h.ref);if(b){b.status=b.status==='New'?'Pending':b.status;log(b,S.role,'Seat hold released manually. Seats are available again.')}toast('Hold released. '+h.seats+' seats are available again.');render()}return}
 const of=e.target.closest('[data-offer]');if(of){const t=tripOf(of.dataset.offer),w=t.wait[0];if(w&&w.seats<=availSeats(t)){t.wait.shift();toast('Offer sent to '+(can('pii')?w.n:'the first person')+' for '+w.seats+' seat(s). It expires in 12 hours.');render()}else toast('Not enough free seats for the first waitlist request ('+(w?w.seats:0)+').');return}
 const a=e.target.closest('[data-act]');if(a)act(a.dataset.act,a);
 const tp=e.target.closest('[data-tpl]');if(tp){S.msgTpl=tp.dataset.tpl;S.compose=S.route.slice(8);render();return}
});
document.addEventListener('keydown',e=>{const r=e.target.closest&&e.target.closest('[data-open-b]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go('booking-'+r.dataset.openB)}if(e.key==='Escape'&&S.popOpen){S.popOpen=false;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){S.bf.q=t.value;render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='gq'&&e.key==='Enter'){const v=e.target.value.trim().toUpperCase();if(BK.find(x=>x.ref===v)){go('booking-'+v);return}if(ENQ.find(x=>x.id===v)){go('enquiry-'+v);return}S.bf={tab:'All',q:e.target.value,trip:'',pay:'',status:'',from:'',dep:''};go('bookings')}});
document.addEventListener('change',e=>{const t=e.target,f=S.bf;
 if(t.id==='ft'){f.trip=t.value;render()}else if(t.id==='fs'){f.status=t.value;render()}else if(t.id==='fp'){f.pay=t.value;render()}else if(t.id==='ff'){f.from=t.value;render()}else if(t.id==='fd'){f.dep=t.value;render()}
 else if(t.id==='nev'){S.nfilter=t.value;render()}else if(t.id==='role'){S.role=t.value;S.edit=null;S.compose=null;render();toast('Now viewing as '+S.role)}
 else if(t.id==='sim'&&t.value){const ty=t.value;t.value='';const r=SIMS[ty]();fire(ty,r[0],r[1],'EV-'+(++S.nid));}
 else if(t.dataset&&t.dataset.pref){const[k,c]=t.dataset.pref.split('|');S.chan[k][c]=t.checked;toast('Preference updated')}});
function act(k,el){const ref=S.route.startsWith('booking-')?S.route.slice(8):null,b=ref&&BK.find(x=>x.ref===ref);
 if(k==='saveprefs'){S.prefs.email=$('#pe').value;S.prefs.names=$('#pn').checked;toast('Preferences saved');return}
 if(!b)return;
 if(k==='confirm'){b.status='Confirmed';log(b,S.role,'Booking confirmed. Payment status unchanged: '+payStatus(b)+'.');const t=tripOf(b.trip);t.hold=t.hold.filter(h=>h.ref!==b.ref);b.msgs.unshift({t:NOW.toISOString(),sub:TPL.Confirmation.sub,tpl:'Confirmation',by:S.role,body:''});log(b,'System','Confirmation email sent.');if(availSeats(t)===0)fire('full',t.id,t.name+' is full. Waitlist is open','FULL-'+t.id+'-'+S.nid);toast('Booking confirmed and confirmation sent.');render();return}
 if(k==='resend'){b.msgs.unshift({t:NOW.toISOString(),sub:TPL.Confirmation.sub,tpl:'Confirmation (resent)',by:S.role,body:''});log(b,S.role,'Confirmation email resent.');toast('Confirmation resent to '+(can('pii')?b.email:'the customer')+'.');render();return}
 if(k==='cancel'){if(!confirm('Cancel booking '+b.ref+'? Seats will be released and the customer will be told.'))return;b.status='Cancelled';b.cancelled=true;const t=tripOf(b.trip);t.hold=t.hold.filter(h=>h.ref!==b.ref);log(b,S.role,'Booking cancelled. Seats released.');toast('Booking cancelled. '+b.seats+' seats released.');render();return}
 if(k==='edit'){S.edit=b.ref;render();return}if(k==='canceledit'){S.edit=null;render();return}
 if(k==='saveedit'){const n=$('#en').value.trim(),em=$('#ee').value.trim(),ph=$('#ep').value.trim(),se=+$('#eseats').value;const er=$('#eerr');
  if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||ph.length<6){er.textContent='Enter a name, a valid email and a phone number.';return}
  const t=tripOf(b.trip);if(se<1||se>12){er.textContent='Seats must be between 1 and 12.';return}
  if(se>b.seats&&se-b.seats>availSeats(t)){er.textContent='Only '+availSeats(t)+' more seat(s) are available on this trip.';return}
  const ch=[];if(n!==b.name)ch.push('name');if(em!==b.email)ch.push('email');if(ph!==b.phone)ch.push('phone');if(se!==b.seats)ch.push('seats '+b.seats+' to '+se);b.name=n;b.email=em;b.phone=ph;b.emergency=$('#eem').value;b.requests=$('#ers').value;b.seats=se;S.edit=null;
  log(b,S.role,'Traveller information edited'+(ch.length?' ('+ch.join(', ')+')':'')+'.');fire('modified',b.ref,'Booking modified, '+(ch.length?ch.join(', ')+' changed':'details updated'),'MOD-'+b.ref+'-'+S.nid);return}
 if(k==='reassign'){const id=$('#reassign').value;if(id===b.trip){toast('That is already the booked trip.');return}const nt=tripOf(id);if(b.seats>availSeats(nt)){toast('Not enough seats on '+nt.name+' ('+availSeats(nt)+' left).');return}const from=tripOf(b.trip).name;b.trip=id;log(b,S.role,'Trip changed from '+from+' to '+nt.name+'.');fire('modified',b.ref,'Booking modified, moved to '+nt.name,'MOV-'+b.ref+'-'+S.nid);return}
 if(k==='manualpay'){const am=+$('#mp-a').value,r=$('#mp-r').value.trim(),er=$('#mperr');if(!(am>0)){er.textContent='Enter the amount you received.';return}if(!r){er.textContent='A transaction reference or receipt number is required for manual payments.';return}
  if(am>total(b)-paid(b)){er.textContent='That is more than the balance ('+money(total(b)-paid(b))+').';return}
  b.pays.push({amt:am,method:$('#mp-m').value,date:NOW.toISOString(),txn:r,src:'Manual, by '+S.role});b.failed=false;log(b,S.role,'Manual payment of '+money(am)+' recorded ('+r+'). Payment status is now '+payStatus(b)+'.');fire('payment_ok',b.ref,'Payment recorded manually, '+money(am),'MP-'+b.ref+'-'+S.nid);return}
 if(k==='refund'){const amt=paid(b);b.refunded={amt,t:NOW.toISOString(),by:S.role,txn:'REF-'+b.ref};b.refund='done';log(b,S.role,'Refund of '+money(amt)+' recorded ('+b.refunded.txn+'). Payment status: Refunded.');toast('Refund recorded.');render();return}
 if(k==='note'){const v=$('#note').value.trim();if(!v){toast('Write a note first.');return}b.notes.unshift({t:NOW.toISOString(),who:S.role,text:v});log(b,S.role,'Internal note added.');render();return}
 if(k==='closecompose'){S.compose=null;render();return}
 if(k==='send'){const sub=$('#msub').value.trim(),body=$('#mbody').value.trim();if(!sub||!body){toast('Add a subject and a message.');return}b.msgs.unshift({t:NOW.toISOString(),sub,tpl:S.msgTpl==='Custom'?'Custom message':S.msgTpl,by:S.role,body});log(b,S.role,'Email sent: '+sub);S.compose=null;toast('Message sent and saved to the history.');render();return}
}
render();
})();
</script>

</body>
